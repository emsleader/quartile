# PRISMA 2020 checklist. Item numbers are the official ones; item text is paraphrased in Quartile's own words.
# check: auto   -> found / not_found from the detection hint
# check: manual -> needs_human; when a hint is given and matches, the item shows "found" with the evidence span.
checklist:
  id: PRISMA2020
  name: "PRISMA 2020 (systematic reviews)"
  citation: "Page, M. J., McKenzie, J. E., Bossuyt, P. M., et al. (2021). The PRISMA 2020 statement: an updated guideline for reporting systematic reviews. BMJ, 372, n71. https://doi.org/10.1136/bmj.n71"
  designs: [slr]
  numbering: official
  official_items: 27
  licence_note: "Item numbers from the statement; item text paraphrased, not reproduced."
items:
  - { number: "1", topic: "Title", item: "The title says the paper is a systematic review.", check: auto, where: title, detect: '\b(systematic (literature )?review|scoping review|meta-analy\w+)\b' }
  - { number: "2", topic: "Abstract", item: "The abstract reports the review in structured form (PRISMA 2020 for Abstracts).", check: auto, where: [abstract, opening], detect: '\b(systematic (literature )?review|PRISMA|databases?|(studies|articles|papers) (were )?included)\b' }
  - { number: "3", topic: "Rationale", item: "The introduction explains why the review is needed, given what is already known.", check: manual, where: [introduction], detect: '\b(no (prior|previous|existing) (systematic )?review|gap|remains? (unclear|fragmented)|lack of (a )?(synthesis|review))\b' }
  - { number: "4", topic: "Objectives", item: "The review states its objectives or questions explicitly.", check: auto, where: [introduction, methods, abstract], detect: '\b(aims? (is|are|to)|objectives?|research questions?|RQ ?\d|this review (seeks|aims|asks))\b' }
  - { number: "5", topic: "Eligibility criteria", item: "The inclusion and exclusion criteria are stated, with how studies were grouped for synthesis.", check: auto, where: [methods], detect: '\b(inclusion criteria|exclusion criteria|eligibility criteria|(were|was) (included|eligible) if|(were|was) excluded if)\b' }
  - { number: "6", topic: "Information sources", item: "Every database, register, website or other source searched is named, with the date each was last searched.", check: auto, where: [methods], detect: '\b(Scopus|Web of Science|PubMed|MEDLINE|EBSCO\w*|ProQuest|Google Scholar|JSTOR|ScienceDirect|EconLit|PsycINFO|Business Source|databases? (were |was )?searched|last searched)\b' }
  - { number: "7", topic: "Search strategy", item: "The full search strategy is given for every source, including filters and limits.", check: auto, where: [methods], detect: '\b(search (string|strategy|terms|query|queries)|Boolean|TITLE-ABS-KEY|keywords? (used|were))\b' }
  - { number: "8", topic: "Selection process", item: "The selection method is described: how many reviewers screened each record, whether they worked independently, and any automation used.", check: auto, where: [methods], detect: '\b(two (independent )?(reviewers|authors|coders)|independently (screened|reviewed)|inter-?rater|Cohen.?s kappa|Rayyan|Covidence|title and abstract screening|screened (the )?titles)\b' }
  - { number: "9", topic: "Data collection process", item: "The data extraction method is described: how many people extracted data, independence, and confirmation with study authors.", check: auto, where: [methods], detect: '\b(data extraction|extraction (form|sheet|template)|coding (form|sheet|scheme)|(we )?extracted (the )?(data|information))\b' }
  - { number: "10a", topic: "Data items", item: "All outcomes sought are listed and defined, with the rule for choosing among several results per study.", check: manual, where: [methods], detect: '\b(outcomes? (sought|of interest|were (coded|extracted))|data items)\b' }
  - { number: "10b", topic: "Data items", item: "All other variables extracted (study and participant characteristics, funding) are listed, with assumptions about missing information.", check: manual, where: [methods], detect: '\b(we (extracted|coded|recorded)|(extracted|coded|recorded) (the following|information on|data on))\b' }
  - { number: "11", topic: "Study risk of bias assessment", item: "The method and tool used to judge risk of bias or quality in the included studies are described.", check: auto, where: [methods], detect: '\b(risk of bias|quality (assessment|appraisal)|critical appraisal|CASP|MMAT|Newcastle-Ottawa|AMSTAR|ROBINS|RoB ?2|JBI)\b' }
  - { number: "12", topic: "Effect measures", item: "For each outcome the effect measure used in synthesis is stated (applies when results are pooled or compared numerically).", check: manual, where: [methods], detect: '\b(effect sizes?|odds ratios?|risk ratios?|(standardi[sz]ed )?mean differences?|Hedges.? g|Cohen.?s d|Fisher.?s z)\b' }
  - { number: "13a", topic: "Synthesis methods", item: "The process for deciding which studies entered each synthesis is described.", check: manual, where: [methods] }
  - { number: "13b", topic: "Synthesis methods", item: "Any preparation of data for synthesis (missing statistics, conversions) is described.", check: manual, where: [methods] }
  - { number: "13c", topic: "Synthesis methods", item: "Methods used to tabulate or display results of studies and syntheses are described.", check: manual, where: [methods], detect: '\b(tabulat\w+|summary tables?|forest plots?|evidence (gap )?maps?|concept matrix)\b' }
  - { number: "13d", topic: "Synthesis methods", item: "The synthesis method is described and justified; for a meta-analysis, the model, heterogeneity measures and software.", check: auto, where: [methods], detect: '\b(meta-analy\w+|narrative synthesis|thematic synthesis|framework synthesis|qualitative synthesis|vote counting|random[- ]effects?|fixed[- ]effects? (model|meta)|content analysis|bibliometric|co-citation|bibliographic coupling)\b' }
  - { number: "13e", topic: "Synthesis methods", item: "Methods used to explore causes of heterogeneity (subgroups, meta-regression) are described.", check: manual, where: [methods], detect: '\b(meta-regression|subgroup analys\w+|moderator analys\w+)\b' }
  - { number: "13f", topic: "Synthesis methods", item: "Sensitivity analyses used to test the robustness of the synthesis are described.", check: manual, where: [methods], detect: '\bsensitivity analys\w+\b' }
  - { number: "14", topic: "Reporting bias assessment", item: "Methods used to judge the risk of bias from missing results (for example publication bias) are described.", check: manual, where: [methods], detect: '\b(publication bias|funnel plots?|Egger|small-study effects?|reporting bias)\b' }
  - { number: "15", topic: "Certainty assessment", item: "Methods used to judge certainty or confidence in the body of evidence are described.", check: manual, where: [methods], detect: '\b(GRADE|certainty of (the )?evidence|confidence in (the )?evidence|CERQual)\b' }
  - { number: "16a", topic: "Study selection", item: "The results of the search and selection are reported, from records found to studies included, ideally with a flow diagram.", check: auto, where: [methods, results], detect: '\b(flow (diagram|chart)|PRISMA (flow|diagram)|records? (were )?(identified|retrieved)|(studies|articles|papers) (were )?included)\b' }
  - { number: "16b", topic: "Study selection", item: "Studies that seemed to meet the criteria but were excluded are cited, with the reason for exclusion.", check: manual, where: [methods, results], detect: '\b(reasons? for exclusion|excluded (studies|articles|reports) (with|and) (their )?reasons|list of excluded)\b' }
  - { number: "17", topic: "Study characteristics", item: "Each included study is cited and its characteristics are presented.", check: manual, where: [results], detect: '\b(characteristics of (the )?included|study characteristics|included (studies|articles) (are|is) (listed|summari[sz]ed))\b' }
  - { number: "18", topic: "Risk of bias in studies", item: "The risk-of-bias or quality judgement for each included study is presented.", check: manual, where: [results], detect: '\b(risk of bias|quality (scores?|ratings?|assessment))\b' }
  - { number: "19", topic: "Results of individual studies", item: "For every outcome, each study's summary statistics and effect estimate with precision are presented.", check: manual, where: [results] }
  - { number: "20a", topic: "Results of syntheses", item: "For each synthesis, the characteristics and risk of bias of the contributing studies are summarised.", check: manual, where: [results] }
  - { number: "20b", topic: "Results of syntheses", item: "The results of all statistical syntheses are presented with precision and heterogeneity, if pooling was done.", check: manual, where: [results], detect: '\b(pooled (estimate|effect)|I\^?2|I²|heterogeneity|Q statistic|tau\^?2)\b' }
  - { number: "20c", topic: "Results of syntheses", item: "The results of any investigation of heterogeneity are presented.", check: manual, where: [results] }
  - { number: "20d", topic: "Results of syntheses", item: "The results of any sensitivity analysis are presented.", check: manual, where: [results], detect: '\bsensitivity analys\w+\b' }
  - { number: "21", topic: "Reporting biases", item: "The judged risk of bias from missing results is presented for each synthesis assessed.", check: manual, where: [results], detect: '\b(publication bias|funnel plots?|Egger)\b' }
  - { number: "22", topic: "Certainty of evidence", item: "The certainty or confidence in the evidence is presented for each outcome assessed.", check: manual, where: [results, discussion], detect: '\b(GRADE|certainty of (the )?evidence|confidence in (the )?evidence)\b' }
  - { number: "23a", topic: "Discussion", item: "The results are interpreted in the light of other evidence.", check: manual, where: [discussion, conclusion] }
  - { number: "23b", topic: "Discussion", item: "The limitations of the evidence in the review are discussed.", check: auto, where: [discussion, limitations, conclusion], detect: '\b(limitations?|weakness\w*|shortcomings?)\b' }
  - { number: "23c", topic: "Discussion", item: "The limitations of the review process itself are discussed.", check: manual, where: [discussion, limitations, conclusion], detect: '\b(limitations? of (this|our|the) review|single (reviewer|coder)|(only|restricted to) (English|peer-reviewed)|language restriction)\b' }
  - { number: "23d", topic: "Discussion", item: "Implications for practice, policy and future research are discussed.", check: auto, where: [discussion, implications, conclusion], detect: '\b(implications?|future research|practitioners?|policy ?makers?)\b' }
  - { number: "24a", topic: "Registration and protocol", item: "Registration details are given (register name and number), or the paper says the review was not registered.", check: auto, where: all, detect: '\b(PROSPERO|CRD\d{6,}|osf\.io|OSF Registries|INPLASY|registered|registration|not registered)\b' }
  - { number: "24b", topic: "Registration and protocol", item: "The paper says where the protocol can be found, or that no protocol was prepared.", check: auto, where: all, detect: '\bprotocol\b' }
  - { number: "24c", topic: "Registration and protocol", item: "Any changes to the registered information or protocol are described and explained.", check: manual, where: all, detect: '\b(amendments?|deviat\w+ from (the )?protocol|changes? (to|from) (the )?(protocol|registration))\b' }
  - { number: "25", topic: "Support", item: "Financial and non-financial support for the review, and the role of funders or sponsors, are described.", check: auto, where: all, detect: '\b(funding|funded by|grant|financial support|received no (specific )?(funding|grant))\b' }
  - { number: "26", topic: "Competing interests", item: "The review authors declare their competing interests.", check: auto, where: all, detect: '\b(competing interests?|conflicts? of interest|declare\w* (that )?(they have )?no)\b' }
  - { number: "27", topic: "Availability of data, code and other materials", item: "The paper says which materials are public and where (extraction forms, extracted data, analysis code, other materials).", check: auto, where: all, detect: '\b(data availability|(are|is) (publicly )?available (at|from|on|in)|supplementary (materials?|files?)|repository|osf\.io|zenodo|github)\b' }
