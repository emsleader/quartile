# STROBE checklist (22 items; sub-items a-e where the statement has them). Official item numbers; item text
# paraphrased in Quartile's own words. Items written for clinical cohorts (follow-up, risk) are check: manual.
checklist:
  id: STROBE
  name: "STROBE (observational studies)"
  citation: "von Elm, E., Altman, D. G., Egger, M., Pocock, S. J., Gøtzsche, P. C., & Vandenbroucke, J. P. (2007). The Strengthening the Reporting of Observational Studies in Epidemiology (STROBE) statement: guidelines for reporting observational studies. The Lancet, 370(9596), 1453-1457. https://doi.org/10.1016/S0140-6736(07)61602-X"
  designs: [regression, survey, sem]
  numbering: official
  official_items: 22
  licence_note: "Item numbers from the statement; item text paraphrased, not reproduced."
items:
  - { number: "1a", topic: "Title and abstract", item: "The design is named with a common term in the title or abstract.", check: auto, where: [title, abstract, opening], detect: '\b(cross-sectional|cohort|case-control|panel|longitudinal|observational|survey|secondary data)\b' }
  - { number: "1b", topic: "Title and abstract", item: "The abstract gives a balanced, informative summary of what was done and found.", check: manual, where: [abstract, opening] }
  - { number: "2", topic: "Background / rationale", item: "The scientific background and the reason for the study are explained.", check: manual, where: [introduction, literature] }
  - { number: "3", topic: "Objectives", item: "The objectives are stated, including any hypotheses fixed in advance.", check: auto, where: [introduction, literature, methods, abstract], detect: '\b(aims? (is|are|to)|objectives?|hypothes[ie]s|H\d+[a-z]?\b|research questions?)\b' }
  - { number: "4", topic: "Study design", item: "Key elements of the design are presented early in the paper.", check: auto, where: [methods], detect: '\b(cross-sectional|cohort|case-control|panel (data|study|dataset)|longitudinal|observational|secondary data|research design|study design)\b' }
  - { number: "5", topic: "Setting", item: "The setting, locations and relevant dates (recruitment, exposure, follow-up, data collection) are described.", check: auto, where: [methods], detect: '\b(19|20)\d{2}\b|\b(January|February|March|April|May|June|July|August|September|October|November|December)\b' }
  - { number: "6", topic: "Participants", item: "Eligibility criteria and the sources and methods for selecting participants (or firms) are given.", check: auto, where: [methods], detect: '\b(eligib\w+|inclusion criteria|sampling frame|(were|was) (selected|sampled|drawn)|we (selected|drew|sampled)|drawn from|population of)\b' }
  - { number: "7", topic: "Variables", item: "All outcomes, exposures, predictors, confounders and effect modifiers are clearly defined.", check: auto, where: [methods], detect: '\b(dependent variable|independent variables?|outcome variables?|control variables?|measured (as|by|using|with)|defined as|operationali[sz]ed|proxied by)\b' }
  - { number: "8", topic: "Data sources / measurement", item: "For each variable, the data source and the way it was measured are given, and comparability across groups is discussed.", check: auto, where: [methods], detect: '\b(data (were|was|are|is) (obtained|drawn|collected|sourced|taken)|data sources?|database|Orbis|Compustat|Amadeus|Enterprise Surveys?|Eurostat|questionnaire|scale (of|with)|items? (adapted|taken) from)\b' }
  - { number: "9", topic: "Bias", item: "Efforts to deal with possible sources of bias are described.", check: auto, where: [methods, results], detect: '\b(bias|endogeneity|common method|non-?response|selection (effects?|problems?)|reverse causality)\b' }
  - { number: "10", topic: "Study size", item: "The paper explains how the study size was reached.", check: auto, where: [methods, results], detect: '\b(sample size|power analys\w+|G\*Power|final sample|study size|minimum sample)\b' }
  - { number: "11", topic: "Quantitative variables", item: "The handling of quantitative variables is explained, including any groupings and why they were chosen.", check: manual, where: [methods], detect: '\b(categori[sz]ed|dummy|logarithm\w*|log-transformed|natural log|winsori[sz]ed|standardi[sz]ed|quartiles?|tertiles?)\b' }
  - { number: "12a", topic: "Statistical methods", item: "All statistical methods are described, including those used to control for confounding.", check: auto, where: [methods], detect: '\b(regression|OLS|logit|probit|fixed effects?|structural equation|estimat\w+|ANOVA|t-tests?)\b' }
  - { number: "12b", topic: "Statistical methods", item: "Methods used to examine subgroups and interactions are described.", check: manual, where: [methods], detect: '\b(interaction terms?|subgroups?|subsamples?|moderat\w+)\b' }
  - { number: "12c", topic: "Statistical methods", item: "The handling of missing data is explained.", check: auto, where: [methods, results], detect: '\b(missing (data|values|observations|responses)|imputation|imputed|listwise|pairwise deletion|complete cases?)\b' }
  - { number: "12d", topic: "Statistical methods", item: "Design-specific handling is described: loss to follow-up, matching, or the sampling strategy (for example weights).", check: manual, where: [methods], detect: '\b(sampling weights?|survey weights?|weighted|stratif\w+|matching|clustered)\b' }
  - { number: "12e", topic: "Statistical methods", item: "Any sensitivity analyses are described.", check: auto, where: [methods, results], detect: '\b(sensitivity analys\w+|robustness (checks?|tests?|analys\w+))\b' }
  - { number: "13a", topic: "Participants (results)", item: "Numbers at each stage are reported (eligible, examined, confirmed eligible, included, analysed).", check: auto, where: [methods, results], detect: '\b(final sample|remained|leaving|(were|was) excluded|response rate|responded|were dropped)\b' }
  - { number: "13b", topic: "Participants (results)", item: "Reasons for non-participation at each stage are given.", check: manual, where: [methods, results], detect: '\b(reasons? for (non-?participation|exclusion|non-?response)|did not respond|non-?respon\w+)\b' }
  - { number: "13c", topic: "Participants (results)", item: "A flow diagram is considered.", check: manual, where: all, detect: '\bflow (diagram|chart)\b' }
  - { number: "14a", topic: "Descriptive data", item: "Characteristics of the participants (or firms) and of exposures and confounders are described.", check: auto, where: [methods, results], detect: '\b(descriptive statistics|summary statistics|means? and standard deviations?|sample characteristics)\b' }
  - { number: "14b", topic: "Descriptive data", item: "The number with missing data is shown for each variable of interest.", check: manual, where: [methods, results], detect: '\bmissing\b' }
  - { number: "14c", topic: "Descriptive data", item: "For cohort designs, follow-up time is summarised.", check: manual, where: [results] }
  - { number: "15", topic: "Outcome data", item: "The number of outcome events or summary measures is reported (by exposure group or over time, as the design requires).", check: manual, where: [results] }
  - { number: "16a", topic: "Main results", item: "Unadjusted and adjusted estimates are given with their precision, and the paper says which confounders were adjusted for and why.", check: auto, where: [results], detect: '\b(confidence intervals?|95 ?% CI|standard errors?|t-statistics?|robust SE)\b' }
  - { number: "16b", topic: "Main results", item: "Category boundaries are reported when continuous variables were grouped.", check: manual, where: [results, methods] }
  - { number: "16c", topic: "Main results", item: "Where relevant, relative effects are translated into absolute effects for a meaningful period.", check: manual, where: [results] }
  - { number: "17", topic: "Other analyses", item: "Other analyses are reported (subgroups, interactions, sensitivity).", check: auto, where: [results], detect: '\b(robustness|sensitivity|subgroups?|subsamples?|alternative (specifications?|measures?))\b' }
  - { number: "18", topic: "Key results", item: "The key results are summarised with reference to the objectives.", check: manual, where: [discussion, conclusion] }
  - { number: "19", topic: "Limitations", item: "Limitations are discussed, including sources of bias or imprecision and their likely direction and size.", check: auto, where: [discussion, limitations, conclusion], detect: '\blimitations?\b' }
  - { number: "20", topic: "Interpretation", item: "The interpretation is cautious and weighs the objectives, limitations, multiple analyses and other evidence.", check: manual, where: [discussion, conclusion] }
  - { number: "21", topic: "Generalisability", item: "The external validity of the results is discussed.", check: auto, where: [discussion, limitations, conclusion], detect: '\b(generali[sz]\w+|external validity|transferab\w+|other (countries|contexts|settings|industries))\b' }
  - { number: "22", topic: "Funding", item: "The funding source and the funder's role are stated (for this study and, if relevant, the original study).", check: auto, where: all, detect: '\b(funding|funded by|grant|financial support|received no (specific )?(funding|grant))\b' }
