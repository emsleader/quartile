# One-click deploy on Render: New > Blueprint > select this repository.
services:
  - type: web
    name: quartile-mcp
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: QUARTILE_SECRET
        generateValue: true
      - key: OPENALEX_API_KEY   # free key from openalex.org/settings/api (required by OpenAlex since February 2026)
        sync: false
