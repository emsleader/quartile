name: Build Q1 style profile
# Rebuilds data/style-profile.json and opens a pull request with it. It never commits to main: the profile
# changes rule limits, so the full test suite runs on the rebuilt profile first (0.17.0 broke when a rebuilt
# profile was committed to main directly).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/build-style-brain.js", "core/stylemetrics.js", ".github/workflows/style-brain.yml"]
permissions:
  contents: write
  pull-requests: write
concurrency: { group: style-brain, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: R for the statistics tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends r-base-core r-cran-foreign r-cran-survival
      - run: npm ci
      - run: node scripts/build-style-brain.js --target 500
      - name: Stop if the profile did not change
        id: diff
        run: git diff --quiet -- data/style-profile.json && echo "changed=false" >> "$GITHUB_OUTPUT" || echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Run the full test suite on the rebuilt profile
        if: steps.diff.outputs.changed == 'true'
        id: tests
        run: |
          set -o pipefail
          { npm run lint && npm test && npm run test:stats && npm run test:gold && npm run check:changelog; } 2>&1 | tail -40 | tee test-output.txt
        continue-on-error: true
      - name: Open a pull request with the profile
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.tests.outcome }}
        run: |
          BR="bot/style-profile-$(date -u +%Y%m%d-%H%M)"
          git config user.name "quartile-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -b "$BR"
          git add -f data/style-profile.json
          git commit -m "Update Q1 style profile (measurements only)"
          git push -u origin "$BR"
          TITLE="Update Q1 style profile (measurements only)"; [ "$OUTCOME" = "success" ] || TITLE="[tests fail] $TITLE"
          { echo "Rebuilt by the style-brain workflow. Tests on the rebuilt profile: **$OUTCOME**."; echo; echo '```'; cat test-output.txt; echo '```'; echo; echo "Pull requests opened by the workflow token do not start other workflows, so the tests ran in this job. Merge only when they passed. Rule limits in rulebook/q1corpus.yaml follow this file."; } > body.md
          gh pr create --base main --head "$BR" --title "$TITLE" --body-file body.md
          [ "$OUTCOME" = "success" ]
