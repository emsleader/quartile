name: FER — discover MNB official editions 2011–2026
on:
  push:
    branches: [research/fer-mnb-evidence-20261117]
    paths:
      - 'research/fer_mnb_discover.py'
      - '.github/workflows/fer-mnb-discover.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet requests beautifulsoup4
      - run: python research/fer_mnb_discover.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FER-MNB-Official-Index-Discovery-2011-2026
          path: mnb_discovery/
          retention-days: 30
