name: FER MNB official policy rate timeline 2011–2026
on:
  push:
    branches: [research/fer-mnb-evidence-20261117]
    paths: ['.github/workflows/fer-mnb-policy-rate.yml']
  workflow_dispatch:
permissions: {contents: read}
jobs:
  base-rate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python research/fer_mnb_base_rates.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MNB-Official-Central-Bank-Base-Rate-History-2011-2026
          path: mnb_monetary_rates/
          retention-days: 30
