name: FER R aggregate audit and Q1 reference bank
on:
  push:
    branches: [main, feature/fer-100-references-r-aggregate-qa]
    paths: ["core/ferreferences.js", "data/fer-q1-100-validated-metadata.json", "tests/ferreferences.test.js", "tests/fer-r-aggregate-gate.R", "tests/fer-aggregate-fixture.tsv", "mcp/server.js", "mcp/package.json", ".github/workflows/fer-r-q1-reference-audit.yml"]
  pull_request:
    paths: ["core/ferreferences.js", "data/fer-q1-100-validated-metadata.json", "tests/ferreferences.test.js", "tests/fer-r-aggregate-gate.R", "tests/fer-aggregate-fixture.tsv", "mcp/server.js", "mcp/package.json", ".github/workflows/fer-r-q1-reference-audit.yml"]
permissions:
  contents: read
jobs:
  q1-metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Verify 100 DOI metadata and 2025 journal-rank caveats
        run: node tests/ferreferences.test.js
      - run: node --check mcp/server.js
      - name: No raw firm files in repository
        run: |
          if find . -type f \\( -iname '*.dta' -o -iname '*.sav' \\) | grep -q .; then
            echo "ERROR: private WBES microdata must not be committed"
            exit 1
          fi
  r-aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: {r-version: '4.3.3'}
      - name: Genuine R execution on independent AGGREGATE fixture
        run: Rscript tests/fer-r-aggregate-gate.R tests/fer-aggregate-fixture.tsv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fer-r-aggregate-session
          path: fer_r_aggregate_validation_session.txt
          if-no-files-found: ignore
