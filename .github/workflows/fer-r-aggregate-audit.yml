name: FER R cross-software aggregate verification
on:
  push:
    branches: [main, feature/fer-r-aggregate-literature-method-audit]
    paths: ["tests/fer-r-aggregate-gate.R","tests/fer-aggregate-fixture.tsv","docs/FER-100-PAPER-COMPARISON-AND-R-BOUNDARIES.md",".github/workflows/fer-r-aggregate-audit.yml"]
  pull_request:
    paths: ["tests/fer-r-aggregate-gate.R","tests/fer-aggregate-fixture.tsv","docs/FER-100-PAPER-COMPARISON-AND-R-BOUNDARIES.md",".github/workflows/fer-r-aggregate-audit.yml"]
permissions:
  contents: read
jobs:
  actual-r-4-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.3'
      - name: Execute actual R checks (aggregate evidence only)
        run: Rscript tests/fer-r-aggregate-gate.R tests/fer-aggregate-fixture.tsv
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: R-session-info
          path: fer_r_aggregate_validation_session.txt
          if-no-files-found: ignore
