name: Corpus smoke test (real open-access PDFs, nothing kept)
on:
  workflow_dispatch:
  push:
    paths: ["mcp/corpus.js", "scripts/corpus-smoke.js", ".github/workflows/corpus-smoke.yml"]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: cd mcp && npm ci
      - run: node scripts/corpus-smoke.js 24 2>&1 | grep -v "polyfill\|Require stack\|node_modules"
