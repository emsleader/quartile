name: FER model formula audit
on:
  push:
    branches: [main, feature/fer-formula-validation]
    paths:
      - core/fermodels.js
      - core/ferliterature.js
      - data/fer-literature-100-candidates.json
      - tests/ferliterature.test.js
      - mcp/server.js
      - mcp/package.json
      - mcp/package-lock.json
      - tests/fermodels.test.js
      - tests/fixture-fer-aggregates.json
      - tests/run.js
      - tests/fermodels.mcp-smoke.js
      - data/fer-hungary-independent-replication-2026-11-17.json
      - .github/workflows/fer-model-audit.yml
  pull_request:
    paths:
      - core/fermodels.js
      - core/ferliterature.js
      - data/fer-literature-100-candidates.json
      - tests/ferliterature.test.js
      - mcp/server.js
      - mcp/package.json
      - mcp/package-lock.json
      - tests/fermodels.test.js
      - tests/fixture-fer-aggregates.json
      - tests/run.js
      - data/fer-hungary-independent-replication-2026-11-17.json
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: FER formula, reference metadata and adversarial tests (no microdata)
        run: |
          node tests/fermodels.test.js
          node tests/ferliterature.test.js
      - name: Syntax-check MCP server and FER evaluator
        run: |
          node --check mcp/server.js
          node --check core/fermodels.js
          node --check core/ferliterature.js
          node --check tests/run.js
      - name: Install Quartile MCP dependencies
        run: cd mcp && npm ci --omit=dev
      - name: Smoke-test FER tools using a real MCP client
        run: node tests/fermodels.mcp-smoke.js
      - name: Ensure no identifiable WBES raw files are present
        run: |
          if find . -type f \( -iname '*.dta' -o -iname '*.sav' \) | grep -q .; then
            echo 'ERROR: raw microdata must never be committed to Quartile'
            exit 1
          fi
