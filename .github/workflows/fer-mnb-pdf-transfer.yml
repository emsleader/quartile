name: Temporary MNB source PDFs transport to Google Drive
on:
  push:
    branches: [research/oecd-pdf-transfer-only-20261118]
    paths: ['.github/workflows/fer-mnb-pdf-transfer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Download verified PDF originals only (nothing committed)
        run: |
          python - <<'PY'
          import urllib.request,urllib.parse,urllib.error,concurrent.futures,os,hashlib,csv,time,json,re,html
          from html.parser import HTMLParser
          sources=[["2011_Financial_Stability_November","https://www.mnb.hu/letoltes/jelentes-penzugyi-stabilitas-201111-en.pdf","direct"],["2012_Financial_Stability_November","https://www.mnb.hu/letoltes/jelentes-penzugyi-stabilitas-201211-en.pdf","direct"],["2014_Trends_in_Lending_February","https://www.mnb.hu/letoltes/hitelezesi-folyamatok-201402-en.pdf","direct"],["2015_Trends_in_Lending_March","https://www.mnb.hu/letoltes/hitelezesi-folyamatok-201503-en-2.pdf","direct"],["2016_Trends_in_Lending_February","https://www.mnb.hu/letoltes/hitelezesi-folyamatok-201602-en.PDF","direct"],["2017_Trends_in_Lending_March","https://www.mnb.hu/letoltes/hitelezesi-folyamatok-2017-marcius-en.pdf","direct"],["2018_Trends_in_Lending_August","https://www.mnb.hu/letoltes/hitelezesi-folyamatok-2018-augusztus-en.PDF","direct"],["2024_Trends_in_Lending_November","https://www.mnb.hu/en/publications/reports/trends-in-lending/trends-in-lending-november-2024","landing"],["2025_Trends_in_Lending_February","https://www.mnb.hu/en/publications/reports/trends-in-lending/trends-in-lending-february-2025","landing"],["2026_Financial_Stability_June","https://www.mnb.hu/letoltes/financial-stability-report-june-2026.pdf","direct"],["2026_Inflation_Report_March","https://www.mnb.hu/letoltes/eng-ir-digitalis-31.pdf","direct"],["2025_Financial_Stability_November","https://www.mnb.hu/en/publications/reports/financial-stability-report/financial-stability-report-november-2025","landing"],["2024_Financial_Stability_November","https://www.mnb.hu/en/publications/reports/financial-stability-report/financial-stability-report-november-2024","landing"]]
          os.makedirs("mnb_transfer",exist_ok=True)
          class LinkCollector(HTMLParser):
            def __init__(self):super().__init__();self.items=[];self.href=None;self.txt=[]
            def handle_starttag(self,tag,attrs):
              if tag=="a":self.href=dict(attrs).get("href");self.txt=[]
            def handle_data(self,txt):
              if self.href:self.txt.append(txt)
            def handle_endtag(self,tag):
              if tag=="a" and self.href:self.items.append((self.href," ".join(self.txt)));self.href=None
          def read(url):
            req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (academic research archive)","Accept":"application/pdf,text/html"})
            with urllib.request.urlopen(req,timeout=80) as r:return r.read(),r.headers.get("Content-Type","")
          def get(row):
            name,url,kind=row;err="";lasturl=url
            for k in range(3):
              try:
                if kind=="landing":
                  raw,ct=read(url);p=LinkCollector();p.feed(raw.decode("utf-8",errors="replace"));links=[]
                  for href,label in p.items:
                    absu=urllib.parse.urljoin(url,html.unescape(href))
                    if not re.search(r"\.pdf(?:$|[?#])",absu,re.I):continue
                    if "/letoltes/" not in absu:continue
                    if ("trends" in label.lower() or "financial stability" in label.lower() or "hitelez" in label.lower() or "report" in label.lower()):score=10
                    else:score=0
                    if "flyer" in absu.lower() or "presentation" in absu.lower():score-=10
                    links.append((score,absu))
                  if not links:raise ValueError("Landing has no PDF link")
                  links.sort(reverse=True);lasturl=links[0][1]
                b,ct=read(lasturl)
                if not b.startswith(b"%PDF-") or len(b)<10000:raise ValueError("Wrong PDF type or too small")
                path="mnb_transfer/"+name+".pdf"
                with open(path,"wb") as f:f.write(b)
                return dict(name=name,url=lasturl,status="DOWNLOADED_VERIFIED",bytes=len(b),sha256=hashlib.sha256(b).hexdigest(),error="")
              except Exception as e:err=str(e);time.sleep(1+k)
            return dict(name=name,url=lasturl,status="FAILED",bytes=0,sha256="",error=err)
          with concurrent.futures.ThreadPoolExecutor(max_workers=6) as pool:rs=list(pool.map(get,sources))
          with open("mnb_transfer/MNB_EXTRA_2011_2026_MANIFEST.csv","w",newline="") as f:
            w=csv.DictWriter(f,fieldnames=list(rs[0]));w.writeheader();w.writerows(rs)
          print(json.dumps(rs,indent=2))
          assert sum(x["status"]=="DOWNLOADED_VERIFIED" for x in rs)>=9
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MNB-Additional-Full-PDFs-Temporary-Transfer
          path: mnb_transfer/
          retention-days: 1
