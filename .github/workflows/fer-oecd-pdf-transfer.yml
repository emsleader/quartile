name: Temporary OECD PDF transport to Google Drive archive
on:
  push:
    branches: [research/oecd-pdf-transfer-only-20261118]
    paths: ['.github/workflows/fer-oecd-pdf-transfer.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    steps:
      - name: Retrieve five public OECD complete original PDF files
        run: |
          python - <<'PY'
          import concurrent.futures,urllib.request,time,os,hashlib,csv,json
          sources=[["2018","https://www.oecd.org/content/dam/oecd/en/publications/reports/2018/02/financing-smes-and-entrepreneurs-2018_g1g893a8/fin_sme_ent-2018-en.pdf"],["2019","https://www.oecd.org/content/dam/oecd/en/publications/reports/2019/04/financing-smes-and-entrepreneurs-2019_g1g9f5e1/fin_sme_ent-2019-en.pdf"],["2020","https://www.oecd.org/content/dam/oecd/en/publications/reports/2020/04/financing-smes-and-entrepreneurs-2020_3ddd9917/061fe03d-en.pdf"],["2022","https://www.oecd.org/content/dam/oecd/en/publications/reports/2022/03/financing-smes-and-entrepreneurs-2022_f1884241/e9073a0f-en.pdf"],["2024","https://www.oecd.org/content/dam/oecd/en/publications/reports/2024/03/financing-smes-and-entrepreneurs-2024_015c0c26/fa521246-en.pdf"]]
          os.makedirs("oecd_transfer",exist_ok=True)
          def get(item):
              year,url=item
              err=""
              for k in range(4):
                try:
                  req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0 (academic archival research)","Accept":"application/pdf"})
                  with urllib.request.urlopen(req,timeout=100) as resp:data=resp.read()
                  if not data.startswith(b"%PDF-") or len(data)<100000:
                    raise ValueError("Not original full PDF: "+repr(data[:20]))
                  path=f"oecd_transfer/OECD_Financing_SMEs_{year}_FULL.pdf"
                  with open(path,"wb") as f:f.write(data)
                  return {"year":year,"url":url,"downloaded":"YES","bytes":len(data),"sha256":hashlib.sha256(data).hexdigest(),"file":path,"error":""}
                except Exception as e:
                  err=repr(e);time.sleep(2+k)
              return {"year":year,"url":url,"downloaded":"NO","bytes":0,"sha256":"","file":"","error":err}
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:rows=list(pool.map(get,sources))
          with open("oecd_transfer/OECD_OFFICIAL_PDF_TRANSFER_MANIFEST.csv","w",newline="") as f:
             w=csv.DictWriter(f,fieldnames=list(rows[0]));w.writeheader();w.writerows(rows)
          print(json.dumps(rows,indent=2))
          assert all(r["downloaded"]=="YES" for r in rows),"Some OECD originals could not be downloaded"
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OECD-Five-Original-Full-PDFs-Transfer-To-Google-Drive
          path: oecd_transfer/
          retention-days: 1
          if-no-files-found: warn
