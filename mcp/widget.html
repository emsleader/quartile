<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quartile</title>
<style>
:root{--bg:#f5f6fb;--panel:#fff;--ink:#141a33;--muted:#5d6480;--line:#e3e6f2;--accent:#4f46e5;--accent2:#eef0ff;--gold:#e5a52a;--ok:#0f8a5f;--okbg:#e3f6ee;--warn:#a86400;--warnbg:#fff3dc;--bad:#c2362b;--badbg:#fde9e7;--grad:linear-gradient(135deg,#4f46e5,#7c3aed)}
.dark{--bg:#0b1024;--panel:#121a36;--ink:#e8eaf6;--muted:#9aa2c4;--line:#232c52;--accent:#8b85ff;--accent2:#1d2550;--ok:#4fd1a1;--okbg:#0f2f25;--warn:#f0b65a;--warnbg:#33290f;--bad:#ff8a80;--badbg:#3a1d1b}
*{box-sizing:border-box}body{margin:0;font:14px/1.55 system-ui,-apple-system,"Segoe UI",Inter,sans-serif;color:var(--ink);background:transparent}
.wrap{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--panel)}
.top{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#0e1530;color:#fff;background-image:radial-gradient(400px 120px at 90% -40%,rgba(124,58,237,.6),transparent 60%)}
.top b{font:700 17px Georgia,serif}.top b span{color:#f6c453}.top .k{margin-left:auto;font-size:12px;color:#c9cdf0}
.body{padding:14px 16px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tile{flex:1 1 120px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.tile .v{font:700 20px Georgia,serif}.tile .l{font-size:12px;color:var(--muted)}
.pill{display:inline-block;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:600;background:var(--accent2);color:var(--accent);margin:2px 4px 2px 0}
.high{background:var(--badbg);color:var(--bad)}.med{background:var(--warnbg);color:var(--warn)}.ok{background:var(--okbg);color:var(--ok)}
ul{margin:6px 0;padding-left:18px}li{margin:4px 0}
h3{font-size:13px;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.q{font-size:12px;color:var(--muted)}.empty{color:var(--muted);padding:18px 0}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><svg width="28" height="28" viewBox="0 0 64 64"><rect width="64" height="64" rx="16" fill="#1b2450"/><rect x="11" y="11" width="19" height="19" rx="5" fill="#6d63f0" opacity=".6"/><rect x="34" y="11" width="19" height="19" rx="5" fill="#f2b33d"/><rect x="11" y="34" width="19" height="19" rx="5" fill="#6d63f0" opacity=".35"/><rect x="34" y="34" width="19" height="19" rx="5" fill="#7c3aed" opacity=".8"/></svg><b><span>Q</span>uartile</b><span class="k" id="kind">waiting for results</span></div>
  <div class="body" id="out"><div class="empty">Results appear here when a Quartile tool runs.</div></div>
</div>
<script>
const E = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sev = s => s === "high" || s === "fail" ? "high" : s === "med" || s === "medium" || s === "warn" ? "med" : s === "low" || s === "ok" ? "ok" : "";
const tile = (v, l) => `<div class="tile"><div class="v">${E(v)}</div><div class="l">${E(l)}</div></div>`;
function render(d) {
  if (!d) return; const o = document.getElementById("out"), k = document.getElementById("kind"); let h = "";
  if (d.kind === "statistics") {
    k.textContent = "Statistics check";
    h += `<div class="stats">${tile(d.summary.problems, "problems")}${tile(d.summary.apaResults, "tests recomputed")}${tile(d.summary.tableCells, "table cells")}${tile(d.summary.software.join(", ") || "none", "software format")}</div>`;
    h += d.problems.length ? `<ul>${d.problems.map(p => `<li><span class="pill ${sev(p.severity)}">${E(p.severity)}</span>${E(p.problem)}<div class="q">${E(p.text)}</div></li>`).join("")}</ul>` : `<p><span class="pill ok">consistent</span> No inconsistencies in the statistics that could be parsed.</p>`;
    h += `<p class="q">${E(d.note)}</p>`;
  } else if (d.kind === "verify") {
    k.textContent = "Hallucination guard";
    h += `<p><span class="pill ${d.pass ? "ok" : "high"}">${d.pass ? "PASS: meaning preserved" : "BLOCKED: keep the original"}</span></p>`;
    if (d.blocking.length) h += `<h3>Blocking</h3><ul>${d.blocking.map(f => `<li>${E(f.type)}<div class="q">${E(f.detail)}</div></li>`).join("")}</ul>`;
    if (d.warnings.length) h += `<h3>Check</h3><ul>${d.warnings.map(f => `<li>${E(f.type)}<div class="q">${E(f.detail)}</div></li>`).join("")}</ul>`;
  } else if (d.kind === "desk") {
    k.textContent = "Desk-rejection screen"; h += deskHtml(d);
  } else if (d.kind === "analysis") {
    k.textContent = "Manuscript audit";
    h += `<div class="stats">${tile(d.words.toLocaleString(), "words")}${tile(d.sections.length, "sections")}${tile(d.references.references.length, "references")}${tile(d.aiStyle.per1k, "AI-style per 1,000 words")}${tile(d.statistics.problems, "statistics problems")}</div>`;
    h += `<p><span class="pill">${E(d.design)}</span>${(d.namedTheories || []).map(t => `<span class="pill">${E(t)}</span>`).join("")}</p>`;
    h += deskHtml(d.deskScreen);
    const issues = [...(d.q1RuleFlags || []).map(f => ({ s: f.sev, t: "Q1 rule " + f.rule + ": " + f.detail })), ...(d.businessResearchIssues || []).map(x => ({ s: x.severity, t: x.problem })), ...(d.consistency || []).map(x => ({ s: x.severity, t: x.problem })), ...(d.citationStyle || []).map(x => ({ s: x.severity, t: x.problem }))];
    if (issues.length) h += `<h3>Issues (${issues.length})</h3><ul>${issues.slice(0, 40).map(x => `<li><span class="pill ${sev(x.s)}">${E(x.s || "")}</span>${E(x.t)}</li>`).join("")}</ul>`;
    const r = d.references; if (r.missingFromList.length) h += `<h3>Cited but not in the list</h3><p>${r.missingFromList.map(c => `<span class="pill high">${E(c)}</span>`).join("")}</p>`;
  } else if (d.kind === "style") {
    k.textContent = "Q1 style profile";
    if (d.error) { o.innerHTML = `<p class="empty">${E(d.error)}</p>`; return; }
    h += `<div class="stats">${tile(d.distance + "%", "outside the Q1 middle range")}${tile(d.withinProfile + "/" + d.metricsChecked, "measures within range")}${tile(d.profile.n, "Q1 abstracts (" + d.profile.name + ")")}</div>`;
    if (d.largestGaps.length) h += `<h3>Largest gaps</h3><ul>${d.largestGaps.map(g => `<li><b>${E(g.label)}</b>: ${E(g.value)} <span class="q">(Q1 median ${E(g.median)}, middle half ${E(g.p25)}–${E(g.p75)})</span><div class="q">${E(g.fix)}</div></li>`).join("")}</ul>`;
    if (d.moveNotes.length) h += `<h3>Structure</h3><ul>${d.moveNotes.map(x => `<li>${E(x)}</li>`).join("")}</ul>`;
    h += `<p class="q">${E(d.note)}</p>`;
  } else if (d.kind === "corpus_status") {
    k.textContent = "Full-text corpus";
    if (d.error || d.available === false) { o.innerHTML = `<p class="empty">${E(d.error || d.note)}</p>`; return; }
    const j = d.job || {};
    h += `<div class="stats">${tile(d.papers, "papers in the folder")}${tile(d.measured, "measured")}${tile(j.phase || "idle", j.running ? `${j.done}/${j.total}` : "job")}</div>`;
    h += `<p class="q">${E(d.folder || "")}</p>` + (j.recent && j.recent.length ? `<ul>${j.recent.slice(-6).map(x => `<li class="q">${E(x)}</li>`).join("")}</ul>` : "");
  } else if (d.kind === "corpus") {
    k.textContent = "Compared with the full-text corpus";
    if (d.error) { o.innerHTML = `<p class="empty">${E(d.error)}</p>`; return; }
    h += `<div class="stats">${tile(d.distance + "%", "outside the corpus middle range")}${tile(d.profile.n, "corpus papers (" + d.profile.field + ")")}</div>`;
    h += `<h3>Largest gaps</h3><ul>${(d.largestGaps || []).map(g => `<li><b>${E(g.role)}</b>: ${E(g.label)} ${E(g.value)} <span class="q">(corpus median ${E(g.median)})</span></li>`).join("")}</ul>` + (d.notes || []).map(x => `<p class="q">${E(x)}</p>`).join("");
  } else if (d.kind === "corpus_search") {
    k.textContent = "Closest corpus papers";
    h += d.error ? `<p class="empty">${E(d.error)}</p>` : `<ul>${d.results.map(r => `<li><b>${E(r.title || "")}</b> <span class="q">${E(r.journal || "")} ${E(r.year || "")} · ${E(r.section || "")}</span><div class="q">${E(r.snippet)}</div>${r.doi ? `<div class="q">doi: ${E(r.doi)}</div>` : ""}</li>`).join("")}</ul><p class="q">${E(d.note)}</p>`;
  } else if (d.kind === "originality") {
    k.textContent = "Originality against the corpus";
    h += d.error ? `<p class="empty">${E(d.error)}</p>` : `<p><span class="pill ${d.pass ? "ok" : "high"}">${d.pass ? "Original wording" : d.overlapping.length + " sentence(s) copy 8+ words"}</span></p><ul>${d.overlapping.map(x => `<li>${E(x.sentence)}<div class="q">shares "${E(x.overlap)}" with ${E((x.source && x.source.title) || "a corpus paper")}</div></li>`).join("")}</ul><p class="q">${E(d.rule)}</p>`;
  } else if (d.kind === "integrity") {
    k.textContent = "Integrity screen (COPE-aligned)";
    const pg = { none: "ok", minor: "med", substantial: "high" };
    h += `<div class="stats">${tile(d.grade, "overlap with other work")}${tile(d.redundancy, "overlap with own work")}${tile(d.overlappingSentences + "/" + d.sentencesChecked, "sentences overlapping")}${tile(d.unattributed, "unattributed")}</div>`;
    h += `<ul>${d.actions.map(a => `<li>${E(a)}</li>`).join("")}</ul>`;
    if (d.flagged.length) h += `<h3>Flagged sentences</h3><ul>${d.flagged.slice(0, 15).map(f => `<li>${E(f.sentence)}<div class="q">${E(f.source)} · ${f.cited ? "cited" : "not cited"}${f.quoted ? ", quoted" : ""} · ${E(f.fix)}</div></li>`).join("")}</ul>`;
    if (d.coverLetterDisclosure) h += `<h3>Cover-letter disclosure (draft)</h3><p>${E(d.coverLetterDisclosure)}</p>`;
    h += `<p class="q">${E(d.basis)}</p>`;
  } else if (d.kind === "references") {
    k.textContent = "References";
    h += `<div class="stats">${tile(d.references.length, "references")}${tile(d.missingFromList.length, "cited, not listed")}${tile(d.neverCited.length, "listed, never cited")}${tile(d.last5Years, "from the last 5 years")}</div>`;
    if (d.missingFromList.length) h += `<h3>Cited but not in the list</h3><p>${d.missingFromList.map(c => `<span class="pill high">${E(c)}</span>`).join("")}</p>`;
    if (d.neverCited.length) h += `<h3>Never cited</h3><ul>${d.neverCited.map(t => `<li class="q">${E(t.slice(0, 160))}</li>`).join("")}</ul>`;
  } else if (d.kind === "journals") {
    k.textContent = "Journal bank";
    h += d.results.length ? `<ul>${d.results.map(j => `<li><b>${E(j.title)}</b> <span class="pill">${E(j.quartile)}</span><span class="pill ${j.difficulty >= 80 ? "high" : j.difficulty >= 60 ? "med" : "ok"}">${E(j.level)} (${E(j.difficulty)})</span><div class="q">SJR ${E(j.sjr)} · ${E(j.mainCategory)}</div></li>`).join("")}</ul>` : `<p class="empty">${E(d.note || "No journals matched.")}</p>`;
  } else if (d.kind === "ai_style") {
    k.textContent = "AI-style signal";
    h += `<div class="stats">${tile(d.score, "score (0-100)")}${tile(d.band, "band")}${tile(d.scoreAfterFixes, "after the safe fixes")}${tile(d.replacements.length, "fixes ready")}</div>`;
    h += `<h3>Features</h3><ul>${Object.values(d.features).map(f => `<li><span class="pill ${f.contribution > 0.5 ? "high" : f.contribution > 0 ? "med" : "ok"}">${E(f.value)}</span>${E(f.label)} <span class="q">(typical ${E(f.typical)})</span></li>`).join("")}</ul>`;
    if (d.hotspots && d.hotspots.length) h += `<h3>Paragraphs that read as generic</h3><ul>${d.hotspots.map(x => `<li><span class="pill high">${E(x.score)}</span><span class="q">${E(x.start)}…</span></li>`).join("")}</ul>`;
    if (d.replacements.length) h += `<h3>Suggested fixes</h3><ul>${d.replacements.slice(0, 12).map(r => `<li class="q">${E(r.quote)}<div>${E(r.replacement)}</div></li>`).join("")}</ul>`;
    h += `<p class="q">${E(d.formula)}</p><p class="q">${E(d.note)}</p>`;
  } else if (d.kind === "number_registry") {
    k.textContent = "Number registry";
    h += `<div class="stats">${tile(d.numbers, "numbers traced")}${tile(d.matched, "matched to output")}${tile(d.check, "check")}${tile(d.notFound, "not in output")}</div>`;
    const bad = d.rows.filter(r => r.status !== "matched" && r.status !== "no output supplied");
    if (bad.length) h += `<h3>To trace or correct</h3><ul>${bad.slice(0, 30).map(r => `<li><span class="pill ${r.status === "check" ? "med" : "high"}">${E(r.text)}</span>${E(r.status)}${r.how ? " · " + E(r.how) + " (" + E(r.sourceValue) + ")" : ""}<div class="q">${E(r.context)}</div></li>`).join("")}</ul>`;
    if (d.summaryNotInResults.length) h += `<h3>In the abstract or conclusion but not in the results</h3><ul>${d.summaryNotInResults.map(r => `<li><span class="pill med">${E(r.text)}</span><span class="q">${E(r.context)}</span></li>`).join("")}</ul>`;
    h += `<p class="q">${E(d.note)}</p>`;
  } else if (d.kind === "readiness") {
    k.textContent = "Submission readiness";
    h += `<div class="stats">${tile(d.score, "readiness (0-100)")}${tile(d.deskRisk, "desk risk")}${tile(d.aiStyle.score, "AI-style")}</div><p><span class="pill ${d.score >= 80 ? "ok" : d.score >= 60 ? "med" : "high"}">${E(d.band)}</span></p>`;
    h += `<ul>${d.penalties.map(p => `<li><b>−${E(p.penalty)}</b> ${E(p.area)}<div class="q">${E(p.why)}</div></li>`).join("")}</ul><p class="q">${E(d.formula)}</p><p class="q">${E(d.note)}</p>`;
  } else if (d.kind === "references_live") {
    k.textContent = "References verified with Crossref";
    h += `<div class="stats">${tile(d.checked, "checked")}${tile(d.verified, "verified")}${tile(d.problems, "to fix")}</div>`;
    h += `<ul>${d.results.filter(r => r.status !== "verified").map(r => `<li><span class="pill ${sev(r.severity)}">${E(r.status)}</span>${E(r.reference)}${(r.issues || []).map(i => `<div class="q">${E(i)}</div>`).join("")}${r.fix ? `<div class="q">${E(r.fix)}</div>` : ""}</li>`).join("")}</ul><p class="q">${E(d.source)}</p>`;
  } else if (d.kind === "literature_overlap") {
    k.textContent = "Overlap with published literature";
    h += `<div class="stats">${tile(d.sentencesQueried, "sentences searched")}${tile(d.sentencesWithMatches, "with a match")}</div>` + (d.warning ? `<p><span class="pill high">not checked</span>${E(d.warning)}</p>` : "");
    h += d.hits.length ? `<ul>${d.hits.map(x => `<li>${E(x.sentence)}<div class="q">"${E(x.phrase)}" also in: ${x.matches.map(m => E(m.title) + (m.doi ? " (doi:" + E(m.doi) + ")" : "")).join("; ")}</div></li>`).join("")}</ul>` : d.warning ? "" : `<p><span class="pill ok">no exact matches</span></p>`;
    h += `<p class="q">${E(d.note)}</p>`;
  } else if (d.kind === "rstats") {
    k.textContent = "Statistics (R)";
    if (d.error) { o.innerHTML = `<p class="empty">${E(d.error)}</p>` + (d.problems ? `<ul>${d.problems.map(x => `<li class="q">${E(x)}</li>`).join("")}</ul>` : ""); return; }
    const rc = d.record || {};
    h += `<div class="stats">${tile(d.results.length, "procedures")}${tile(rc.rows, "rows")}${tile((rc.r_version || "").replace("R version ", "R "), "software")}</div>`;
    h += `<h3>Results</h3><ul>${d.apa.map(x => `<li>${E(x)}</li>`).join("")}</ul>`;
    if (d.warnings && d.warnings.length) h += `<h3>R warnings</h3><ul>${d.warnings.map(x => `<li class="q">${E(x)}</li>`).join("")}</ul>`;
    h += `<h3>Reproducibility record</h3><p class="q">data SHA-256 ${E(rc.data_sha256)}<br>script SHA-256 ${E(rc.script_sha256)}<br>${E(rc.r_version)} · foreign ${E(rc.foreign_version)} · ${E(rc.created)}</p>`;
    h += `<details><summary>R script</summary><pre style="white-space:pre-wrap;font-size:11px">${E(d.script)}</pre></details><p class="q">${E(d.note)}</p>`;
  } else if (d.kind === "prose") {
    k.textContent = "Prose and readability"; const rd = d.readability || {};
    h += `<div class="stats">${tile(d.count, "issues")}${tile(d.replacements.length, "safe edits")}${tile(rd.fleschReadingEase ?? "–", "Flesch reading ease")}${tile(rd.fleschKincaidGrade ?? "–", "grade level")}</div>`;
    h += `<p>${Object.entries(d.byType).map(([t, n]) => `<span class="pill">${E(t)}: ${n}</span>`).join("")}</p><ul>${d.issues.slice(0, 40).map(i => `<li><span class="pill med">${E(i.quote)}</span>${E(i.message)}<div class="q">${E(i.sentence.slice(0, 200))}</div></li>`).join("")}</ul><p class="q">${E(d.note)}</p>`;
  } else if (d.kind === "grammar") {
    k.textContent = "Grammar";
    h += `<div class="stats">${tile(d.count, "issues")}${tile(d.replacements.length, "safe edits")}${tile(d.chunksChecked, "parts checked")}</div>`;
    h += `<ul>${d.issues.slice(0, 40).map(i => `<li><span class="pill med">${E(i.quote)}</span>${E(i.message)}${i.replacement ? " → <b>" + E(i.replacement) + "</b>" : ""}<div class="q">${E(i.context)}</div></li>`).join("")}</ul><p class="q">${E(d.note)}</p>`;
  } else { k.textContent = "Result"; h = `<pre style="white-space:pre-wrap;font-size:12px">${E(JSON.stringify(d, null, 2).slice(0, 4000))}</pre>`; }
  o.innerHTML = h;
}
function deskHtml(r) {
  if (!r) return "";
  return `<h3>Desk-rejection risk</h3><p><span class="pill ${sev(r.risk)}">${E(r.risk)}</span></p><ul>${(r.criteria || []).map(c => `<li><span class="pill ${sev(c.status)}">${E(c.status)}</span><b>${E(c.criterion)}</b>${c.checks.filter(x => x.s !== "ok").map(x => `<div class="q">• ${E(x.t)}${x.fix ? " → " + E(x.fix) : ""}</div>`).join("")}</li>`).join("")}</ul>`;
}
// ChatGPT exposes the result on window.openai; MCP Apps hosts (Claude, ChatGPT) send it over the ui/* bridge.
if (window.openai && window.openai.toolOutput) render(window.openai.toolOutput);
window.addEventListener("openai:set_globals", () => window.openai && render(window.openai.toolOutput));
if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.classList.add("dark");
</script>
<script type="module">
/*__EXT_APPS__*/
try {
  const app = new window.__MCPApps.App({ name: "quartile-widget", version: "0.8.0" });
  app.ontoolresult = r => render(r && r.structuredContent);
  app.onhostcontextchanged = c => { if (c && c.theme) document.documentElement.classList.toggle("dark", c.theme === "dark"); };
  await app.connect();
  const c = app.getHostContext && app.getHostContext(); if (c && c.theme) document.documentElement.classList.toggle("dark", c.theme === "dark");
} catch (e) { /* not inside an MCP Apps host */ }
</script>
</body>
</html>
